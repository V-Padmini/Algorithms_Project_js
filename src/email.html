<!DOCTYPE html>
<html>
<head>
  <title>Email Id Generator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    .container {
      background-color: white;
      width: 90%;
      max-width: 850px;
      margin: auto;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
    }

    h2, h3 {
      color: #333;
    }

    button {
    display: block;
    width: 90%;
    margin: 15px auto;
    background-color: #007bff;
    color: white;
    border: none;
    padding: 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
}

    button:hover {
      background-color: #0056b3;
    }

    .details {
      margin-top: 25px;
      text-align: left;
    }

    .details p {
      font-size: 18px;
      margin: 12px 0;
      word-break: break-word;
    }

    span {
      color: #007bff;
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: left;
      word-break: break-word;
    }

    th {
      background-color: #007bff;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f5f5f5;
    }

    @media (max-width: 768px) {
      button {
        width: 100%;
        font-size: 15px;
      }

      h2 {
        font-size: 22px;
      }

      .details p {
        font-size: 16px;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 15px;
      }

      h2 {
        font-size: 20px;
      }

      button {
        font-size: 14px;
        padding: 10px;
      }

      .details p {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h2>Email Id Generator</h2>

    <button onclick="generateIndianNameEmailId()">
      Generate Indian Name Email Id
    </button>

    <button onclick="generateEnglishNameEmailId()">
      Generate English Name Email Id
    </button>

    <div class="details">
      <p>First Name: <span id="firstNameDisplay"></span></p>
      <p>Last Name: <span id="lastNameDisplay"></span></p>
      <p>Email: <span id="generatedEmail"></span></p>
    </div>

    <h3>Generated Email History</h3>

    <table>
      <thead>
        <tr>
          <th>Type</th>
          <th>First Name</th>
          <th>Last Name</th>
          <th>Email</th>
        </tr>
      </thead>

      <tbody id="historyTableBody"></tbody>
    </table>

  </div>

  <script>
    const indianFirstNames = [
      "Chirag", "Chaitanya", "Chetan", "Chinmay", "Charan",
      "Chirayu", "Chiranj", "Chetas", "Chaital", "Charvik",
      "Dev", "Dhruv", "Dinesh", "Darsh", "Divit",
      "Dheer", "Danish", "Dattatreya", "Daksh", "Darshan",
      "Eshan", "Ekansh", "Eshwar", "Eklavya", "Ekagrah",
      "Ekveer", "Elan", "Elam", "Eshaanth", "Ekaj",
      "Harsh", "Hriday", "Hitesh", "Himanshu", "Harshit",
      "Hiral", "Haran", "Harit", "Hemant",
      "Jay", "Jatin", "Jivan", "Jitesh", "Janak",
      "Jeet", "Jeevan", "Jairaj", "Jayan", "Jabir",
      "Kunal", "Karan", "Krishna", "Karthik", "Kabir",
      "Kushal", "Kavya", "Karthikeya", "Kamal"
    ];

    const indianLastNames = [
      "Acharya", "Agarwal", "Aggarwal", "Agrawal", "Ahuja",
      "Anand", "Bahl", "Bahri", "Bains", "Bajaj",
      "Bajwa", "Bakshi", "Bali", "Banerjee", "Bansal",
      "Chahal", "Chakrabarti", "Chakraborty", "Chand", "Chandra",
      "Chatterjee", "Dalal", "Das", "Dasgupta", "Datta",
      "Dave", "Dayal", "De", "Deol", "Desai",
      "Deshmukh", "Deshpande", "Devi", "Dewan", "Dey",
      "Bhalwari", "Dhar", "Dhawan", "Dhillon"
    ];

    const englishFirstNames = [
      "George", "Ivan", "Dimitra", "Nikolai", "Peter",
      "Alexander", "Hristo", "Stephen", "Jordan", "Vasil",
      "Maria", "Ivanka", "Elena", "Yordanka", "Daniela",
      "Desislava", "Petya", "Gergana", "Rositsa", "Victoria",
      "Luka", "Mia", "Jakov", "Nika", "David",
      "Lucija", "Petar", "Mila", "Marta", "Roko",
      "Rita", "Matej", "Eva", "Mihael", "Ema",
      "Fran", "Ana", "Leo", "Andreas", "Georgios",
      "Eleni", "Kostas", "Androula", "Christos", "Georgia",
      "Michalis", "Panagiota", "Panagiotis", "Anna", "Ioannis",
      "Christina", "Marios", "Katerina", "Dimitris", "Ioanna",
      "Noah", "Olivia", "Oliver", "Amelia", "Isla",
      "Arthur", "Ava", "Muhammad", "Ivy", "Leo",
      "Freya", "Harry", "Lily", "Oscar", "Florence",
      "Archie", "Henry", "Willow"
    ];

    const englishLastNames = [
      "Fisher", "Moore", "Jones", "Wood", "Brown",
      "Little", "Meyer", "Weber", "White", "Rossi",
      "Russo", "Garcia", "Silva", "Taylor", "Baker",
      "Novak", "Murphy", "Martin", "Miller", "Smith"
    ];

    const companies = [
      "Nexa", "Zentro", "Cloudix", "Novan", "Pixly",
      "Codeon", "Brivio", "Tekra", "Lumio", "Verto"
    ];

    let history = [];

    function generateEmailId(firstNames, lastNames, type) {
      let firstName = firstNames[Math.floor(Math.random() * firstNames.length)];
      let lastName = lastNames[Math.floor(Math.random() * lastNames.length)];
      let company = companies[Math.floor(Math.random() * companies.length)];
      let randomNumber = Math.floor(Math.random() * 1000);

      let email =
        firstName.toLowerCase() +
        lastName.toLowerCase() +
        randomNumber +
        "@" +
        company.toLowerCase() +
        ".com";

      document.getElementById("firstNameDisplay").innerText = firstName;
      document.getElementById("lastNameDisplay").innerText = lastName;
      document.getElementById("generatedEmail").innerText = email;

      history.unshift({
        type: type,
        firstName: firstName,
        lastName: lastName,
        email: email
      });

      if (history.length > 5) {
        history.pop();
      }

      renderHistory();
    }

    function renderHistory() {
      let tableBody = document.getElementById("historyTableBody");

      tableBody.innerHTML = "";

      history.forEach(function(item) {
        tableBody.innerHTML += `
          <tr>
            <td>${item.type}</td>
            <td>${item.firstName}</td>
            <td>${item.lastName}</td>
            <td>${item.email}</td>
          </tr>
        `;
      });
    }

    function generateIndianNameEmailId() {
      generateEmailId(indianFirstNames, indianLastNames, "Indian");
    }

    function generateEnglishNameEmailId() {
      generateEmailId(englishFirstNames, englishLastNames, "English");
    }
  </script>

</body>
</html>
